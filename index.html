<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central V3 CORRIGIDA</title>
<style>
body{background:#000;color:#fff;font-family:system-ui;padding:10px}
.card{border:3px solid gold;border-radius:18px;padding:14px;margin:12px 0;background:#111;position:relative}
.btn{display:block;background:gold;color:#000;text-align:center;padding:14px;border-radius:30px;font-weight:900;text-decoration:none;margin-top:10px}
.btn2{background:#111;color:gold;border:2px solid gold;border-radius:30px;padding:12px;font-weight:900;width:100%;margin-top:6px}
.in{width:100%;background:#000;border:2px solid #333;border-radius:12px;padding:12px;color:#fff;margin:5px 0}
.trash{position:absolute;top:8px;right:8px;background:#f44;color:#fff;border:none;padding:8px 12px;border-radius:10px;font-size:18px}
.top-add{border:3px dashed gold;border-radius:18px;padding:14px;background:#000}
</style>
</head>
<body>
<h1 style="color:gold;text-align:center">📚 CENTRAL V3 CORRIGIDA</h1>
<p id="contador" style="color:gold;text-align:center;font-weight:900"></p>
<div class="top-add">
<h3 style="color:gold">➕ ADICIONAR NOVA VERSÃO</h3>
<input id="newNome" class="in" placeholder="Ex: V15.0 ULTRA">
<input id="newLink" class="in" placeholder="https://bancogratidaooficial-ops.github.io/NOME/">
<input id="newDesc" class="in" placeholder="Descrição curta">
<button class="btn" onclick="addVersao()">+ ADICIONAR NO CENTRAL</button>
</div>
<div id="listaCentral"></div>
<div class="card" style="text-align:center">
<p>Total: <span id="totalVersoes">0</span> versões</p>
<button class="btn2" onclick="localStorage.removeItem('centralV3');location.reload();">🗑️ LIMPAR TUDO</button>
</div>
<script>
const PADRAO=[{"nome":"⭐ V14.7 ULTRA - COM BOTÃO INSTALAR","link":"https://bancogratidaooficial-ops.github.io/bancogratidao-/","desc":"Versão perfeita"},{"nome":"📖 V13.0 SALVA","link":"https://bancogratidaooficial-ops.github.io/Banco-gratid-o-vers-o-13.0/","desc":"V13 completa"},{"nome":"💎 V15.0 ULTRA DEFINITIVA","link":"https://bancogratidaooficial-ops.github.io/Banco-gratidao-versao-15-ultra/","desc":"V15 com tudo"}];
let versoes=[];try{let s=localStorage.getItem('centralV3');versoes=s?JSON.parse(s):PADRAO.slice();if(!s)localStorage.setItem('centralV3',JSON.stringify(versoes));}catch(e){versoes=PADRAO.slice();}
function save(){localStorage.setItem('centralV3',JSON.stringify(versoes));render();}
function addVersao(){let n=document.getElementById('newNome').value.trim();let l=document.getElementById('newLink').value.trim();let d=document.getElementById('newDesc').value.trim();if(!n){alert('Coloca o NOME!');return;}if(!l||!l.startsWith('http')){alert('Coloca o LINK começando com https://');return;}versoes.unshift({nome:n,link:l,desc:d});save();document.getElementById('newNome').value='';document.getElementById('newLink').value='';document.getElementById('newDesc').value='';alert('✅ Adicionado! Total: '+versoes.length);document.getElementById('listaCentral').scrollIntoView();}
function delVersao(i){if(!confirm('Tirar do Central? Não apaga o repositório!'))return;versoes.splice(i,1);save();}
function render(){let h='';versoes.forEach((v,i)=>{h+=`<div class="card"><button class="trash" onclick="delVersao(${i})">🗑️</button><h3 style="color:gold;padding-right:50px">${v.nome}</h3><small style="color:#aaa">${v.desc||''}</small><br><small style="color:#666;font-size:10px;word-break:break-all">${v.link}</small><a class="btn" href="${v.link}" target="_blank">📲 ABRIR</a><button class="btn2" style="background:#300;color:#f88;border-color:#f44;margin-top:6px" onclick="delVersao(${i})">🗑️ Tirar do Central</button></div>`;});document.getElementById('listaCentral').innerHTML=h||'<div class="card" style="text-align:center">Nenhuma versão</div>';document.getElementById('totalVersoes').innerText=versoes.length;document.getElementById('contador').innerText=`📦 ${versoes.length} versão(ões) salvas`;}
render();
</script>
</body>
</html>
